name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS devDependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check formatting
        run: pnpm format:check

      - name: Run JS skill script tests (100% coverage)
        run: pnpm test:coverage

      - name: Run Python skill script tests (100% coverage)
        run: pnpm test:python
